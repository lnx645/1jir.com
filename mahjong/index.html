<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Mahjong DSRI (PixiJS)</title>
<style>
  body { margin:0; overflow:hidden; font-family:Arial, sans-serif; background:#0a0a1a; }
  #info { position:absolute; top:10px; left:10px; color:#fff; font-size:16px; pointer-events:none; }
  canvas { display:block; }
</style>
</head>
<body>
<div id="info">Mahjong DSRI – Klik dua tile yang sama untuk cocok!</div>
<script type="module">
  import * as PIXI from 'https://cdn.jsdelivr.net/npm/pixi.js@7.2.12/dist/pixi-core.production.min.js';

  // ── Setup aplikasi ──────────────────────────────────────────
  const APP = new PIXI.Application({ width: window.innerWidth, height: window.innerHeight, antialias: true, backgroundColor: '#0a0a1a' });
  document.body.appendChild(APP.view);

  // ── Konfigurasi tile ────────────────────────────────────────
  const TILE_SIZE = 70;
  const ROWS = 6;
  const COLS = 6;
  const GAP = 5;
  const SUITS = ['R', 'G', 'W'];
  const COLORS = { R: '#E53935', G: '#43A047', W: '#FDD835' };

  // Fungsi untuk membuat tile visual
  function createTile(row, col, value, suit) {
    const container = new PIXI.Container();
    container.position.set(
      col * (TILE_SIZE + GAP) + GAP,
      row * (TILE_SIZE + GAP) + GAP
    );

    // Background
    const bg = new PIXI.Graphics();
    bg.beginFill(COLORS[suit] || '#FFFFFF');
    bg.drawRoundRect(0, 0, TILE_SIZE, TILE_SIZE, 6);
    bg.endFill();
    container.addChild(bg);

    // Number
    const txt = new PIXI.Text(String(value), { fontSize: 24, fill: '#FFFFFF', fontWeight: 'bold', align: 'center' });
    txt.x = TILE_SIZE / 2 - txt.width / 2;
    txt.y = TILE_SIZE / 2 - txt.height / 2;
    container.addChild(txt);

    // Store tile metadata
    container.tileMeta = { row, col, value, suit, id: `${row}-${col}-${value}-${suit}` };

    return container;
  }

  // ── Membuat tiles ───────────────────────────────────────────
  const tiles = [];
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const value = ((r + c) % 9) + 1; // angka 1..9
      const suit = SUITS[r % 3];
      const tile = createTile(r, c, value, suit);
      tiles.push(tile);
      APP.stage.addChild(tile);
    }
  }

  // ── Manajemen state ──────────────────────────────────────────
  let selected = new Set();   // akan menyimpan container tile yang dipilih

  function isSelected(tile) {
    return selected.has(tile.tileMeta.id);
  }

  function selectTile(tile) {
    if (!selected.has(tile.tileMeta.id)) {
      selected.add(tile.tileMeta.id);
      tile.scale.set(1.1); // highlight
    }
  }

  function deselectTile(tile) {
    if (selected.has(tile.tileMeta.id)) {
      selected.delete(tile.tileMeta.id);
      tile.scale.set(1.0);
    }
  }

  // Event klik
  APP.stage.interactive = true;
  APP.stage.on('pointerdown', (event) => {
    const clickPos = event.getWorldPosition();
    // Cari tile yang tepat
    for (const tile of tiles) {
      if (!tile.tileMeta || !tile.tileMeta.id) continue;
      const meta = tile.tileMeta;
      const tileCenterX = meta.col * (TILE_SIZE + GAP) + GAP + TILE_SIZE / 2;
      const tileCenterY = meta.row * (TILE_SIZE + GAP) + GAP + TILE_SIZE / 2;
      const distance = Math.hypot(clickPos.x - tileCenterX, clickPos.y - tileCenterY);
      if (distance <= TILE_SIZE / 2 + 5) {
        // Toggle
        if (isSelected(tile)) {
          deselectTile(tile);
        } else {
          selectTile(tile);
          // Jika ada 2, cek match
          if (selected.size >= 2) {
            const selectedTiles = Array.from(selected).map(id => tiles.find(t => t.tileMeta.id === id));
            const [a, b] = selectedTiles;
            if (a && b && a.tileMeta.value === b.tileMeta.value && a.tileMeta.suit === b.tileMeta.suit) {
              // Cocok! Hapus dengan animasi fade out
              animateFadeOut(a);
              animateFadeOut(b);
            } else {
              // Tidak cocok, deselect semua
              selected.forEach(id => deselectTile(tiles.find(t => t.tileMeta.id === id)));
              selected.clear();
            }
          }
        }
        break; // hanya proses satu tile per klik
      }
    }
  });

  // Hover effect
  tiles.forEach(tile => {
    tile.interactive = true;
    tile.on('pointerover', () => {
      if (!isSelected(tile)) {
        tile.scale.set(1.1);
      }
    });
    tile.on('pointerout', () => {
      if (!isSelected(tile)) {
        tile.scale.set(1.0);
      }
    });
  });

  // Animasi fade out
  function animateFadeOut(tile) {
    let alpha = 1.0;
    const interval = setInterval(() => {
      alpha -= 0.05;
      if (alpha <= 0) {
        tile.alpha = 0;
        tile.visible = false;
        clearInterval(interval);
      } else {
        tile.alpha = alpha;
      }
    }, 16); // ~60fps
  }

  // Hover effect dengan animasi halus
  tiles.forEach(tile => {
    tile.on('pointerover', () => {
      tile.animate({ scale: 1.1, duration: 100, onComplete: () => {} });
    });
    tile.on('pointerout', () => {
      tile.animate({ scale: 1.0, duration: 100 });
    });
  });
</script>
</body>
</html>
